# Genesis long-lived cloud worker.
#
# The same Render process runs both the publishing queue and the Awo campaign
# optimisation queue. This avoids a second worker service while keeping long
# AI generation outside Vercel request time limits.
services:
  - type: worker
    name: villiz-publishing-worker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run worker:publishing:cloud
    envVars:
      - key: NODE_VERSION
        value: "22"

      # --- Secrets: set these in the Render dashboard, never in Git. ---
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BLOTATO_API_KEY
        sync: false
      # Awo campaign generation. Use the same provider credential as Genesis.
      - key: OPENAI_API_KEY
        sync: false

      # --- Non-secret configuration. ---
      - key: BLOTATO_ENABLED
        value: "true"
      - key: BLOTATO_LIVE_PUBLISHING_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: "openai"
      - key: AWO_WORKER_CONCURRENCY
        value: "3"
      - key: AWO_WORKER_POLL_INTERVAL_MS
        value: "2000"
