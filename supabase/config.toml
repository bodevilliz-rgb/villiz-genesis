# Supabase CLI configuration.
# Checked in so that `supabase start` and `supabase db reset` behave identically
# for every engineer, and so local auth matches the hosted project's rules.

project_id = "villiz-genesis"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher — magic links land here during development.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Staff are invited, never self-registered. This mirrors the production setting
# and the application's own `shouldCreateUser: false`.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
